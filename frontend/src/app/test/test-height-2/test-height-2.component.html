<div
  *ngIf="!imageLoaded"
  class="parallax-loading"
  [ngStyle]="{
    'background-image': 'url(' + lowResImage + ')',
    'height.px': containerHeight, 
    'background-size': 'cover ' + containerHeight + 'px',
  }"
></div>

<div
  *ngIf="imageLoaded"
  class="parallax"
  [ngStyle]="{
    'background-image': 'url(' + backgroundImageUrl + ')',
    'height.px': containerHeight, 
    'background-size': 'cover ' + containerHeight + 'px',
  }"
></div>
