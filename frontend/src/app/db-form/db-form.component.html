<app-title-image-parralax
[imagePath]="'/Skate/Andy_Ennis.JPG'"
title="Register Skatepark"
subtitle="Enter Details Below"
class="text-styling"
/>
<br />
<div class="container">
  <form [formGroup]="newParkForm" (ngSubmit)="submit()">
    <label for="name">Enter Skatepark Name:</label>
    <input
      type="text"
      id="name"
      formControlName="name"
      class="form-control"
      required
    />
    <!-- <div *ngIf="newParkForm.controls.name.invalid && newParkForm.controls.name.touched">
        <small *ngIf="newParkForm.controls.name.errors?.required">Name is required.</small> -->
    <!-- </div> -->
    <br />
    <label for="address">Enter Skatepark Address:</label>
    <input
      type="text"
      id="address"
      formControlName="address"
      class="form-control"
      required
    />
    <br />

    <label for="lat">Latitude:</label>
    <input
      id="lat"
      type="number"
      formControlName="lat"
      class="form-control"
      required
    />
    <br />
    <!-- <div
      *ngIf="
        newParkForm.controls.lat.invalid && newParkForm.controls.lat.touched
      "
    > -->
    <!-- <small *ngIf="newParkForm.controls.lat.errors?.required">Latitude is required.</small>
        <small *ngIf="newParkForm.controls.lat.errors?.pattern">Invalid latitude format.</small> -->
    <!-- </div> -->
    <label for="lng">Longitude:</label>
    <input
      id="lng"
      type="number"
      formControlName="lng"
      required
      class="form-control"
    />

    <br />
    <div
      *ngIf="
        newParkForm.controls.lng.invalid && newParkForm.controls.lng.touched
      "
    >
      <!-- <small *ngIf="newParkForm.controls.lng.errors?.required">Longitude is required.</small>
        <small *ngIf="newParkForm.controls.lng.errors?.pattern">Invalid longitude format.</small> -->
    </div>

    <label for="surfaceType">Surface Type:</label>
    <input
      id="surfaceType"
      formControlName="surfaceType"
      class="form-control"
    /><br />

    <label for="description">Description:</label>
    <textarea
      id="description"
      formControlName="description"
      class="form-control"
      required
    ></textarea
    ><br />

    <label for="mainImage">Main Image ID:</label>
    <input
      id="mainImage"
      formControlName="mainImage"
      class="form-control"
      required
    /><br />

    <label for="parking">Parking:</label>
    <input id="parking" formControlName="parking" class="form-control" /><br />

    <label for="website">Website:</label>
    <input id="website" formControlName="website" class="form-control" /><br />

    <button style="color: white" type="submit" [disabled]="newParkForm.invalid">
      Submit
    </button>
  </form>

  <!-- <div *ngFor="let park of parks | async">
    <p>{{ park.name }}</p>
  </div>
</div> -->

  <router-outlet></router-outlet>
</div>
